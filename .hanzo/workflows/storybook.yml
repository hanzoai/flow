name: storybook

# The frontend storybook is a SITE, not an App.
#
# It used to publish through actions/deploy-pages
# (.github/workflows/deploy-storybook.yml). That is a second deploy plane living
# outside our own CI/CD, outside the Sites plane, and outside our analytics, so
# it is gone.
#
#   npm run build-storybook -> src/frontend/storybook-static
#     -> POST /v1/projects/flow-storybook/deploy {"source":"git"}  (202, queued)
#     -> aws s3 sync storybook-static s3://<bucket>/<prefix>       (bytes skip the API)
#     -> POST .../deployments/<id>/complete {"status":"live"}
#
# Modelled on hanzoai/hips .hanzo/workflows/deploy.yml, which is the canonical
# shape for this. The bytes go straight to S3 rather than through an artifact
# POST because the door has a 16 MiB BodyLimit that fasthttp enforces BEFORE any
# handler runs, and a storybook bundle clears that easily. cloud names the bucket
# and prefix in the 202 so CI writes exactly where the site is served from.
#
# THIS IS A SEPARATE FILE FROM .hanzo/workflows/deploy.yml ON PURPOSE. That one
# builds and pushes ghcr.io/hanzoai/flow — the App the operator runs. An App is
# a container the cluster executes; a Site is bytes S3 serves. They have
# different outputs, different triggers and different failure modes, and folding
# a storybook export into an image build would couple a docs publish to a
# deployable release.

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**/*.stories.*'
      - 'src/frontend/.storybook/**'
      - 'src/frontend/package.json'
      - 'src/frontend/package-lock.json'
      - '.hanzo/workflows/storybook.yml'
  workflow_dispatch:

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    # NOT ubuntu-latest. These run on the in-cluster act_runner, whose fleet
    # advertises hanzo-build-linux-amd64. A label no runner answers does not
    # fail — it queues until the 24h timeout, which is silence, not an error.
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: build the static export
        working-directory: src/frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build-storybook
          test -s storybook-static/index.html || {
            echo "::error::storybook produced no storybook-static/index.html"; exit 1; }
          # A storybook shell renders with zero stories and still writes a
          # non-empty index.html, so assert the story index has entries rather
          # than trusting the file's existence.
          test -s storybook-static/index.json || {
            echo "::error::storybook wrote no index.json — nothing was indexed"; exit 1; }
          echo "exported $(find storybook-static -type f | wc -l) files"

      # The ONE analytics wire: cloud's hosted tag (cloud apps/analytics/tag.go),
      # which posts the canonical batch to POST /v1/event. There is no Segment,
      # no Google Tag Manager, no second tracker, and no vendored copy of the
      # tag — it is served from the origin that eats it so a page allowlists ONE
      # host.
      #
      # The key is the project's OWN publishable key, read from the project this
      # run is about to deploy. It is never a checked-in constant: pk- is
      # write-only and publishable (same trust class as a Sentry DSN), so it
      # belongs in the page, but its authority is the project record, which means
      # rotation is one server-side change and not five repo edits.
      #
      # NO KEY => NO TAG, deliberately. A keyless beacon is accepted 200 into
      # $public, a reserved tenant this org cannot read, so silence is the honest
      # failure and we pick it over reporting into a tenant nobody reads.
      #
      # This is storybook's generated HTML, which no template of ours can reach,
      # so the tag is stamped into the export. Same step, same shape, in every
      # doc site in this fleet.
      - name: wire the analytics tag
        env:
          DEPLOY_TOKEN: ${{ secrets.HANZO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          KEY=$(curl -sS -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
                  "https://api.hanzo.ai/v1/projects/flow-storybook" | jq -r '.key // empty')
          if [ -z "$KEY" ]; then
            echo "::warning::project flow-storybook exposes no publishable key — publishing untagged rather than beaconing into \$public"
            exit 0
          fi
          TAG="<script defer src=\"https://api.hanzo.ai/v1/event.js\" data-key=\"${KEY}\" data-product=\"flow-storybook\"></script>"
          find src/frontend/storybook-static -name '*.html' -print0 \
            | xargs -0 -r sed -i "s#</head>#${TAG}</head>#"
          echo "tagged $(grep -rl 'v1/event.js' src/frontend/storybook-static | wc -l) pages"

      - name: enqueue the deployment
        id: enqueue
        env:
          DEPLOY_TOKEN: ${{ secrets.HANZO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "::error::HANZO_DEPLOY_TOKEN is unset. It is an org secret on the git.hanzo.ai forge."
            exit 1
          fi
          CODE=$(curl -sS -o /tmp/enq.json -w '%{http_code}' \
            -X POST "https://api.hanzo.ai/v1/projects/flow-storybook/deploy" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"source\":\"git\",\"commit\":\"${GITHUB_SHA}\",\"branch\":\"main\"}")
          # 202 Accepted is the success code — the deployment is queued, not live.
          if [ "$CODE" != "202" ]; then
            echo "::error::enqueue returned HTTP $CODE"; head -c 600 /tmp/enq.json; exit 1
          fi
          # bucket and prefix come FROM cloud. Never hardcode them: prefix is
          # sitePrefix(org, slug) server-side, so a local guess drifts the moment
          # the org or slug changes and the sync lands bytes nobody serves.
          echo "id=$(jq -r .id /tmp/enq.json)"         >> "$GITHUB_OUTPUT"
          echo "bucket=$(jq -r .bucket /tmp/enq.json)" >> "$GITHUB_OUTPUT"
          echo "prefix=$(jq -r .prefix /tmp/enq.json)" >> "$GITHUB_OUTPUT"
          jq -c '{id,version,status,bucket,prefix}' /tmp/enq.json

      - name: sync the export to S3
        id: sync
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SITES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SITES_S3_SECRET_ACCESS_KEY }}
          BUCKET: ${{ steps.enqueue.outputs.bucket }}
          PREFIX: ${{ steps.enqueue.outputs.prefix }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::SITES_S3_* secrets unset — cannot sync. These are the hanzo-sites bucket credentials."
            exit 1
          fi
          # --delete so a removed story actually disappears: without it the
          # prefix only ever grows and deleted stories keep serving.
          aws s3 sync src/frontend/storybook-static "s3://${BUCKET}/${PREFIX}" \
            --endpoint-url https://s3.hanzo.ai --delete --only-show-errors
          echo "files=$(find src/frontend/storybook-static -type f | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "bytes=$(du -sk src/frontend/storybook-static | awk '{print $1*1024}')"   >> "$GITHUB_OUTPUT"

      - name: flip it live
        env:
          DEPLOY_TOKEN: ${{ secrets.HANZO_DEPLOY_TOKEN }}
          DEP: ${{ steps.enqueue.outputs.id }}
          FILES: ${{ steps.sync.outputs.files }}
          BYTES: ${{ steps.sync.outputs.bytes }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/done.json -w '%{http_code}' \
            -X POST "https://api.hanzo.ai/v1/projects/flow-storybook/deployments/${DEP}/complete" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"status\":\"live\",\"commit\":\"${GITHUB_SHA}\",\"files\":${FILES},\"bytes\":${BYTES}}")
          if [ "$CODE" != "200" ]; then
            echo "::error::complete returned HTTP $CODE"; head -c 600 /tmp/done.json; exit 1
          fi
          jq -c '{status,liveUrl,version,files,bytes}' /tmp/done.json

      # A run that dies after the enqueue would leave the deployment "queued" and
      # the project stuck "building" forever. Report the failure so cloud records
      # an honest terminal state instead of a lie by omission.
      - name: report a failed build
        if: failure() && steps.enqueue.outputs.id != ''
        env:
          DEPLOY_TOKEN: ${{ secrets.HANZO_DEPLOY_TOKEN }}
          DEP: ${{ steps.enqueue.outputs.id }}
        run: |
          curl -sS -X POST "https://api.hanzo.ai/v1/projects/flow-storybook/deployments/${DEP}/complete" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" -H 'Content-Type: application/json' \
            -d '{"status":"error","message":"CI build or sync failed"}' >/dev/null || true
          echo "marked deployment ${DEP} as error"
