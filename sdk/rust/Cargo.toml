[package]
name = "hanzo-flow-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Native Rust SDK for the canonical Hanzo Flow REST API (/v1/flow/*)."
license = "MIT"
repository = "https://github.com/hanzoai/flow"
documentation = "https://docs.hanzo.ai/flow"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
