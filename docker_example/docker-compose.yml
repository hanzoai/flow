services:
  flow:
    image: langflowai/flow:latest # or another version tag on https://hub.docker.com/r/langflowai/flow
    pull_policy: always               # set to 'always' when using 'latest' image
    ports:
      - "7860:7860"
    depends_on:
      - postgres
    environment:
      - LANGFLOW_DATABASE_URL=postgresql://flow:flow@postgres:5432/flow
      # This variable defines where the logs, file storage, monitor data and secret keys are stored.
      - LANGFLOW_CONFIG_DIR=/app/flow
    volumes:
      - flow-data:/app/flow

  postgres:
    # Pinned to a specific Debian base (trixie) so the postgres:16 tag does not
    # silently roll its OS underneath us — that roll causes a glibc collation
    # version mismatch warning on existing volumes. Matches the flow image
    # base. See https://github.com/hanzoai/flow/issues/9608
    image: postgres:16-trixie
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flow
    ports:
      - "5432:5432"
    volumes:
      - flow-postgres:/var/lib/postgresql/data

volumes:
  flow-postgres:
  flow-data:
