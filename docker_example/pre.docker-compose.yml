version: "3.8"

services:
  hanzoflow:
    image: hanzoflowai/hanzoflow:1.0-alpha
    ports:
      - "7860:7860"
    depends_on:
      - postgres
    environment:
      - HANZOFLOW_DATABASE_URL=postgresql://hanzoflow:hanzoflow@postgres:5432/hanzoflow
      # This variable defines where the logs, file storage, monitor data and secret keys are stored.
      - HANZOFLOW_CONFIG_DIR=app/hanzoflow
    volumes:
      - hanzoflow-data:/app/hanzoflow

  postgres:
    # Pinned to a specific Debian base (trixie) so the postgres:16 tag does not
    # silently roll its OS underneath us — that roll causes a glibc collation
    # version mismatch warning on existing volumes. Matches the langflow image
    # base. See https://github.com/langflow-ai/langflow/issues/9608
    image: postgres:16-trixie
    environment:
      POSTGRES_USER: hanzoflow
      POSTGRES_PASSWORD: hanzoflow
      POSTGRES_DB: hanzoflow
    ports:
      - "5432:5432"
    volumes:
      - hanzoflow-postgres:/var/lib/postgresql/data

volumes:
  hanzoflow-postgres:
  hanzoflow-data:
