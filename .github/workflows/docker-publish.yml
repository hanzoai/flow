name: Build and Push Docker Image
# Native deploy pipeline is .hanzo/workflows/deploy.yml — GitHub is a mirror.
# This workflow is intentionally a no-op sync notice: image build + push +
# operator deploy now happen in-cluster via Hanzo Git (act_runner + BuildKit).
on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Sync notice
        run: echo "native pipeline is .hanzo/workflows/deploy.yml; GitHub is a mirror"
